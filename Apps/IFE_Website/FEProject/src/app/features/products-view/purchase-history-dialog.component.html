<h2 mat-dialog-title>Purchase History</h2>
<mat-dialog-content>
  <table mat-table [dataSource]="data.history">
    <ng-container matColumnDef="purchasePrice"><th mat-header-cell *matHeaderCellDef>Price</th><td mat-cell *matCellDef="let row">{{ row.purchasePrice | currency }}</td></ng-container>
    <ng-container matColumnDef="quantity"><th mat-header-cell *matHeaderCellDef>Quantity</th><td mat-cell *matCellDef="let row">{{ row.quantity }}</td></ng-container>
    <ng-container matColumnDef="supplier"><th mat-header-cell *matHeaderCellDef>Supplier</th><td mat-cell *matCellDef="let row">{{ row.supplier }}</td></ng-container>
    <ng-container matColumnDef="purchaseDate"><th mat-header-cell *matHeaderCellDef>Date</th><td mat-cell *matCellDef="let row">{{ row.purchaseDate | date: 'shortDate' }}</td></ng-container>
    <ng-container matColumnDef="notes"><th mat-header-cell *matHeaderCellDef>Notes</th><td mat-cell *matCellDef="let row">{{ row.notes }}</td></ng-container>
    <tr mat-header-row *matHeaderRowDef="columns"></tr>
    <tr mat-row *matRowDef="let row; columns: columns"></tr>
  </table>
</mat-dialog-content>
