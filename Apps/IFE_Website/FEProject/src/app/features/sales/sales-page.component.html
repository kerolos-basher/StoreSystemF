<section class="sales-layout">
  <div class="panel-card scan-panel">
    <h1>المبيعات</h1>
    <p>امسح رمز QR لإضافة المنتج للفاتورة</p>
    <app-barcode-scanner (scanned)="onScan($event)" />
  </div>

  <div class="panel-card invoice-panel">
    <h2>الفاتورة</h2>

    @if (store.items().length === 0) {
      <div class="empty-state">لا توجد أصناف — امسح منتجاً للبدء</div>
    } @else {
      <div class="invoice-lines">
        @for (item of store.items(); track item.productDetailsId) {
          <article class="line-card">
            <div class="line-head">
              <div>
                <strong>{{ item.productName }}</strong>
                <small class="barcode-hint">{{ item.barcode }}</small>
              </div>
              <button type="button" class="remove-btn" (click)="store.removeItem(item.productDetailsId)">×</button>
            </div>
            <div class="line-controls">
              <label>الكمية
                <input type="number" min="1" [max]="item.maxQuantity" [ngModel]="item.quantity" (ngModelChange)="store.updateQuantity(item.productDetailsId, +$event)" />
              </label>
              <span>{{ item.unitPrice * item.quantity  }}</span>
            </div>
            <input class="notes-input" placeholder="ملاحظات..." [ngModel]="item.notes" (ngModelChange)="store.updateNotes(item.productDetailsId, $event)" />
          </article>
        }
      </div>
    }

    <!-- <div class="totals">
      <div class="total-row"><span>المجموع الفرعي</span><span>{{ store.subtotal()  }}</span></div>
      <label>الخصم
        <input type="number" min="0" [ngModel]="store.discount()" (ngModelChange)="store.discount.set(+$event || 0)" />
      </label>
      <label>الضريبة
        <input type="number" min="0" [ngModel]="store.tax()" (ngModelChange)="store.tax.set(+$event || 0)" />
      </label>
      <div class="total-row grand"><span>الإجمالي</span><span>{{ store.grandTotal()  }}</span></div>
    </div> -->

    <textarea class="notes-area" placeholder="ملاحظات الفاتورة..." [ngModel]="store.notes()" (ngModelChange)="store.notes.set($event)"></textarea>

    <button class="btn-primary sale-btn" type="button" [disabled]="store.items().length === 0 || completing()" (click)="completeSale()">
      {{ completing() ? 'جاري الحفظ...' : 'تم البيع' }}
    </button>
  </div>
</section>
