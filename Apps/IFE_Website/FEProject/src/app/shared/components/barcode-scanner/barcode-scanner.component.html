<div class="scanner-wrap">
  <p class="scanner-hint">{{ hint() }}</p>
  <input
    #scannerInput
    type="text"
    class="scanner-input"
    autocomplete="off"
    inputmode="numeric"
    placeholder="امسح الباركود أو أدخله يدوياً..."
    (keydown)="onKeyDown($event)"
    (change)="onInput($event)"
  />
</div>
