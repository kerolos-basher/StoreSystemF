<div class="confirm-dialog">
  <div class="confirm-icon" [class.danger]="data.danger !== false" aria-hidden="true">
    {{ data.danger === false ? 'ℹ️' : '⚠️' }}
  </div>
  <h2 mat-dialog-title>{{ data.title }}</h2>
  <mat-dialog-content>
    <p>{{ data.message }}</p>
  </mat-dialog-content>
  <mat-dialog-actions align="end">
    <button type="button" class="btn-secondary" mat-dialog-close>
      {{ data.cancelText ?? 'إلغاء' }}
    </button>
    <button
      type="button"
      class="btn-primary"
      [class.btn-danger]="data.danger !== false"
      (click)="confirm()">
      {{ data.confirmText ?? 'تأكيد' }}
    </button>
  </mat-dialog-actions>
</div>
