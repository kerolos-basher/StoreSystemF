<h2 mat-dialog-title>الباركود — {{ data.productName }}</h2>
<mat-dialog-content class="barcode-content">
  <canvas #barcodeCanvas class="barcode-image"></canvas>
  <p class="barcode-value">{{ data.label.barcode }}</p>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button type="button" (click)="downloadImage()">تحميل الصورة</button>
  <button mat-button type="button" (click)="exportPdf()">تصدير PDF</button>
  <button mat-button type="button" (click)="print()">طباعة</button>
  <button mat-raised-button color="primary" type="button" (click)="close()">إغلاق</button>
</mat-dialog-actions>
