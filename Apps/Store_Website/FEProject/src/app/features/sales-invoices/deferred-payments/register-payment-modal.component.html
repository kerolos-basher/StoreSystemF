<h2 mat-dialog-title>تسجيل دفعة — {{ data.payment.invoiceNumber }}</h2>
<mat-dialog-content>
  <p class="info">المتبقي: <strong>{{ data.payment.remainingAmount | number:'1.2-2' }} ج.م</strong></p>
  <form [formGroup]="form">
    <mat-form-field appearance="outline">
      <mat-label>المبلغ المدفوع</mat-label>
      <input matInput type="number" formControlName="amountPaid" [max]="data.payment.remainingAmount" />
    </mat-form-field>
    <mat-form-field appearance="outline">
      <mat-label>ملاحظات</mat-label>
      <textarea matInput formControlName="notes" rows="3"></textarea>
    </mat-form-field>
  </form>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button type="button" class="btn-secondary" mat-dialog-close>إلغاء</button>
  <button type="button" class="btn-primary" [disabled]="form.invalid || saving()" (click)="submit()">
    {{ saving() ? 'جاري الحفظ...' : 'تسجيل' }}
  </button>
</mat-dialog-actions>
